[package]
name = "laputa-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
webauthn-minimal = { path = "vendor/webauthn-minimal" }
graviola = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Path dependency because the streaming request body (`request_streaming`) is not in a
# published release yet; switch to the released version once it is, so the Docker build
# does not need the sibling checkout.
h12tiny-client-sync = { path = "../../h12tiny/crates/h12tiny-client-sync", features = ["tls"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

