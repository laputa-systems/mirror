[package]
name = "webauthn-minimal"
version = "0.1.0"
edition = "2024"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
ciborium = "0.2"
graviola = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
ts-rs = "12"
